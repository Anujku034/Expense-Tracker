<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Money</title>

    <link rel="stylesheet" href="addedmoney.css">
</head>

<body>

    <div id="AddMoneyForm">

        <label for="Amount">Amount</label>
        <input 
            type="number" 
            id="Amount" 
            placeholder="Enter amount"
        >

        <label for="dateTime">Date & Time</label>
        <input 
            type="datetime-local" 
            id="dateTime"
        >

        <button id="Submit">Submit</button>

    </div>
    <script src="addedmoney.js"></script>

</body>

</html>
