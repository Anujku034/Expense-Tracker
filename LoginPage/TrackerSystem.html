<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>*Expense_Tracker*</title>
    <link rel="stylesheet" href="TrackerSystem.css">
</head>

<body>

    <div id="Body">

        <div id="LoginPage">

            <div id="Heading">

                <div id="SubHeading">
                    <img src="./RupeesImg.jpg" alt="Rupees_Sign">
                    <p>Expense Tracker</p>
                </div>

                <div>
                    <p>Log in to see where your money goes</p>
                </div>

            </div>
            <!-- Username -->
            <div id="username-container">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="e.g. Anuj kumar">
            </div>
            <!-- Password -->
            <div id="password-container">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="********">
            </div>
            <!-- Login -->
            <div id="login">
                <p>Login</p>
            </div>
            <!-- Register -->
            <div id="create-account-link">
                <p>If you don't have an account?</p>
                <button id="RegisterButton">Register</button>
            </div>

        </div>

    </div>
    <script src="TrackerSystem.js"></script>
</body>
</html>
