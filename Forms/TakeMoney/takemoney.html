<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TakeMoney</title>

    <link rel="stylesheet" href="takemoney.css">
</head>

<body>

    <div id="TakenMoney">

        <label for="name">Name</label>
        <input 
            type="text" 
            id="name" 
            placeholder="Who wants to take your Money, Name?"
        >

        <label for="Amount">Amount</label>
        <input 
            type="number" 
            id="Amount" 
            placeholder="XXXXXX"
        >

        <!-- New Date & Time field -->
        <label for="dateTime">Date & Time</label>
        <input 
            type="datetime-local" 
            id="dateTime"
        >

        <button id="Submit">Submit</button>

    </div>

    <script src="takemoney.js"></script>

</body>

</html>
